[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quipu-ubl"
version = "0.2.0"
description = "Offline baseline conformance checks for UBL Invoice XML"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Quipu UBL contributors" }]
keywords = ["ubl", "e-invoicing", "electronic-invoicing", "latam", "xml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Adrinoaimar/quipu-ubl"
Repository = "https://github.com/Adrinoaimar/quipu-ubl"
Documentation = "https://github.com/Adrinoaimar/quipu-ubl/blob/main/SPEC.md"
Issues = "https://github.com/Adrinoaimar/quipu-ubl/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
latam-einvoice = "quipu_ubl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
